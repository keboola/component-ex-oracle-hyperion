[project]
name = "keboola-ex-oracle-hyperion"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.9.0",
    "keboola-utils>=1.1.0",
    "pydantic>=2.11.7",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "keboola.datadirtest @ git+https://github.com/keboola/datadirtest@feat/log-capture-sync-actions",
    "keboola.vcr @ git+https://github.com/keboola/python-vcr-tests@feat/log-capture-sync-actions",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.uv]
override-dependencies = [
    "keboola-vcr @ git+https://github.com/keboola/python-vcr-tests@feat/log-capture-sync-actions",
    "keboola-datadirtest @ git+https://github.com/keboola/datadirtest@feat/log-capture-sync-actions",
    "keboola-component @ git+https://github.com/keboola/python-component@fix/set-default-logger-handler-removal",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
