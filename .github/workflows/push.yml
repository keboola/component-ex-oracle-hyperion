name: Keboola Component Build & Deploy Pipeline
on:
  push:
    branches-ignore:
      - main
    tags:
      - "*"

concurrency: ci-${{ github.ref }}

jobs:
  ci:
    uses: keboola/component-ci/.github/workflows/component-pipeline.yml@feature/source-image-input
    with:
      app_id: "keboola.ex-oracle-hyperion"
      vendor: "keboola"
    secrets: inherit
